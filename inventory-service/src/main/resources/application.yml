server:
  port: 8084

spring:
  application:
    name: inventory-service
  
  datasource:
    url: jdbc:h2:mem:inventorydb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123

app:
  rabbitmq:
    exchange: app.exchange
    queue:
      order-created: order.created.queue
      stock-reserved: stock.reserved.queue
      stock-failed: stock.failed.queue
    routing-key:
      order-created: order.created
      stock-reserved: stock.reserved
      stock-failed: stock.failed

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.microservices.inventory: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
